[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "recsys-engine"
version = "1.0.0"
description = "Large-scale two-stage personalised recommendation engine (AIML-03)"
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=15",
    "tensorflow>=2.16",
    "tf-keras>=2.16",
    "tensorflow-recommenders>=0.7.3",
    "faiss-cpu>=1.8",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "sqlalchemy>=2.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
spark = ["pyspark>=3.5"]
cache = ["redis>=5.0", "psycopg2-binary>=2.9"]
triton = ["tritonclient[http]>=2.44"]
airflow = ["apache-airflow>=2.9"]
ui = ["streamlit>=1.33"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B905", "B008"]
