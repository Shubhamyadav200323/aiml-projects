# Minikube:  eval $(minikube docker-env) && docker build -t recsys-engine:latest . && kubectl apply -f deploy/k8s/
apiVersion: v1
kind: Namespace
metadata: {name: recsys}
---
apiVersion: v1
kind: ConfigMap
metadata: {name: recsys-config, namespace: recsys}
data:
  RECSYS_ARTIFACTS: /app/artifacts
  REDIS_URL: redis://redis:6379/0
  TRITON_URL: triton:8000
  N_CANDIDATES: "300"
  CACHE_TTL_S: "300"
  EXPERIMENT: ranker_dcn_vs_widedeep
  EXPERIMENT_SPLIT: "0.5"
  EVENTS_DB: postgresql+psycopg2://recsys:recsys@postgres:5432/recsys
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: recsys-artifacts, namespace: recsys}
spec: {accessModes: [ReadWriteOnce], resources: {requests: {storage: 5Gi}}}
---
# ================= DATA TIER =================
apiVersion: apps/v1
kind: Deployment
metadata: {name: redis, namespace: recsys}
spec:
  selector: {matchLabels: {app: redis}}
  template:
    metadata: {labels: {app: redis, tier: data}}
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          args: ["--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru"]
          ports: [{containerPort: 6379}]
---
apiVersion: v1
kind: Service
metadata: {name: redis, namespace: recsys}
spec: {selector: {app: redis}, ports: [{port: 6379}]}
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: postgres, namespace: recsys}
spec:
  serviceName: postgres
  selector: {matchLabels: {app: postgres}}
  template:
    metadata: {labels: {app: postgres, tier: data}}
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - {name: POSTGRES_USER, value: recsys}
            - {name: POSTGRES_PASSWORD, value: recsys}
            - {name: POSTGRES_DB, value: recsys}
          ports: [{containerPort: 5432}]
          volumeMounts: [{name: data, mountPath: /var/lib/postgresql/data}]
  volumeClaimTemplates:
    - metadata: {name: data}
      spec: {accessModes: [ReadWriteOnce], resources: {requests: {storage: 1Gi}}}
---
apiVersion: v1
kind: Service
metadata: {name: postgres, namespace: recsys}
spec: {selector: {app: postgres}, ports: [{port: 5432}]}
---
# ================= APPLICATION TIER =================
apiVersion: batch/v1
kind: Job
metadata: {name: train-initial, namespace: recsys}
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: trainer
          image: recsys-engine:latest
          imagePullPolicy: IfNotPresent
          command: [python, -m, recsys.pipeline, train, --dataset, synthetic, --out, /app/artifacts]
          resources: {requests: {cpu: "2", memory: 3Gi}}
          volumeMounts: [{name: artifacts, mountPath: /app/artifacts}]
      volumes: [{name: artifacts, persistentVolumeClaim: {claimName: recsys-artifacts}}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: triton, namespace: recsys}
spec:
  selector: {matchLabels: {app: triton}}
  template:
    metadata: {labels: {app: triton, tier: application}}
    spec:
      containers:
        - name: triton
          image: nvcr.io/nvidia/tritonserver:24.05-py3
          args: [tritonserver, --model-repository=/models/models, --model-control-mode=explicit,
                 --load-model=user_tower, --load-model=ranker_dcn_v2, --load-model=ranker_wide_deep]
          ports: [{containerPort: 8000}, {containerPort: 8002}]
          readinessProbe: {httpGet: {path: /v2/health/ready, port: 8000}, periodSeconds: 5}
          resources: {requests: {cpu: "1", memory: 2Gi}}
          volumeMounts: [{name: artifacts, mountPath: /models, readOnly: true}]
      volumes: [{name: artifacts, persistentVolumeClaim: {claimName: recsys-artifacts}}]
---
apiVersion: v1
kind: Service
metadata: {name: triton, namespace: recsys}
spec: {selector: {app: triton}, ports: [{name: http, port: 8000}, {name: metrics, port: 8002}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: recsys-api, namespace: recsys}
spec:
  replicas: 2
  selector: {matchLabels: {app: recsys-api}}
  template:
    metadata:
      labels: {app: recsys-api, tier: application}
      annotations: {prometheus.io/scrape: "true", prometheus.io/port: "8100"}
    spec:
      containers:
        - name: api
          image: recsys-engine:latest
          imagePullPolicy: IfNotPresent
          envFrom: [{configMapRef: {name: recsys-config}}]
          ports: [{containerPort: 8100}]
          readinessProbe: {httpGet: {path: /ready, port: 8100}, initialDelaySeconds: 10, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /health, port: 8100}, periodSeconds: 10}
          resources: {requests: {cpu: 500m, memory: 1Gi}, limits: {memory: 2Gi}}
          volumeMounts: [{name: artifacts, mountPath: /app/artifacts, readOnly: true}]
      volumes: [{name: artifacts, persistentVolumeClaim: {claimName: recsys-artifacts}}]
---
apiVersion: v1
kind: Service
metadata: {name: recsys-api, namespace: recsys}
spec: {selector: {app: recsys-api}, ports: [{port: 8100}]}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: recsys-api, namespace: recsys}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: recsys-api}
  minReplicas: 2
  maxReplicas: 8
  metrics: [{type: Resource, resource: {name: cpu, target: {type: Utilization, averageUtilization: 70}}}]
---
# ================= PRESENTATION TIER =================
apiVersion: apps/v1
kind: Deployment
metadata: {name: recsys-ui, namespace: recsys}
spec:
  selector: {matchLabels: {app: recsys-ui}}
  template:
    metadata: {labels: {app: recsys-ui, tier: presentation}}
    spec:
      containers:
        - name: ui
          image: recsys-engine:latest
          imagePullPolicy: IfNotPresent
          command: [streamlit, run, ui/app.py, --server.port, "8501", --server.address, 0.0.0.0]
          env: [{name: RECSYS_API_URL, value: "http://recsys-api:8100"}]
          ports: [{containerPort: 8501}]
---
apiVersion: v1
kind: Service
metadata: {name: recsys-ui, namespace: recsys}
spec:
  type: NodePort
  selector: {app: recsys-ui}
  ports: [{port: 8501, targetPort: 8501, nodePort: 30852}]
