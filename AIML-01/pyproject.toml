[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fraud-platform"
version = "1.0.0"
description = "Real-time financial fraud detection platform (AIML-01)"
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn>=1.4",
    "scipy>=1.11",
    "xgboost>=2.0",
    "torch>=2.2",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "sqlalchemy>=2.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
graph = ["torch-geometric>=2.5"]
mlops = ["mlflow>=2.12", "evidently>=0.4.25,<0.5", "feast[redis]>=0.38"]
streaming = ["confluent-kafka>=2.3"]
dashboard = ["streamlit>=1.33", "plotly>=5.20", "networkx>=3.2"]
imbalance = ["imbalanced-learn>=0.12"]
storage = ["redis>=5.0", "psycopg2-binary>=2.9"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.4", "mypy>=1.9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B905", "B008"]
