apiVersion: v1
kind: Namespace
metadata:
  name: fraud
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: fraud-config
  namespace: fraud
data:
  FRAUD_ARTIFACTS: /app/artifacts
  REDIS_URL: redis://redis:6379/0
  KAFKA_BOOTSTRAP: kafka:9092
  MLFLOW_TRACKING_URI: http://mlflow:5000
  REVIEW_THRESHOLD: "0.5"
  DRIFT_SHARE_TRIGGER: "0.3"
---
apiVersion: v1
kind: Secret
metadata:
  name: fraud-db
  namespace: fraud
type: Opaque
stringData:
  # Replace via `kubectl create secret` / sealed-secrets in real environments.
  DATABASE_URL: postgresql+psycopg2://fraud:fraud@postgres:5432/fraud
  POSTGRES_PASSWORD: fraud
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: model-artifacts
  namespace: fraud
spec:
  accessModes: [ReadWriteOnce]   # Minikube hostpath; use ReadWriteMany (EFS/Filestore) in cloud
  resources: {requests: {storage: 2Gi}}
