# ---------------- Presentation tier: analyst dashboard
apiVersion: apps/v1
kind: Deployment
metadata: {name: fraud-dashboard, namespace: fraud}
spec:
  replicas: 1
  selector: {matchLabels: {app: fraud-dashboard}}
  template:
    metadata: {labels: {app: fraud-dashboard, tier: presentation}}
    spec:
      containers:
        - name: dashboard
          image: fraud-platform:latest
          imagePullPolicy: IfNotPresent
          command: [streamlit, run, dashboard/app.py, --server.port, "8501", --server.address, 0.0.0.0]
          env: [{name: FRAUD_API_URL, value: "http://fraud-api:8000"}]
          ports: [{containerPort: 8501}]
          readinessProbe: {httpGet: {path: /_stcore/health, port: 8501}, periodSeconds: 10}
---
apiVersion: v1
kind: Service
metadata: {name: fraud-dashboard, namespace: fraud}
spec:
  type: NodePort
  selector: {app: fraud-dashboard}
  ports: [{port: 8501, targetPort: 8501, nodePort: 30851}]
