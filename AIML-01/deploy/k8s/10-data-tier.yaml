# ---------------- Data tier: PostgreSQL (cases), Redis (online features), Kafka (events)
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: postgres, namespace: fraud}
spec:
  serviceName: postgres
  replicas: 1
  selector: {matchLabels: {app: postgres}}
  template:
    metadata: {labels: {app: postgres, tier: data}}
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - {name: POSTGRES_USER, value: fraud}
            - {name: POSTGRES_DB, value: fraud}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: fraud-db, key: POSTGRES_PASSWORD}}
          ports: [{containerPort: 5432}]
          readinessProbe: {exec: {command: [pg_isready, -U, fraud]}, periodSeconds: 5}
          volumeMounts: [{name: data, mountPath: /var/lib/postgresql/data}]
  volumeClaimTemplates:
    - metadata: {name: data}
      spec: {accessModes: [ReadWriteOnce], resources: {requests: {storage: 1Gi}}}
---
apiVersion: v1
kind: Service
metadata: {name: postgres, namespace: fraud}
spec: {selector: {app: postgres}, ports: [{port: 5432}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: redis, namespace: fraud}
spec:
  replicas: 1
  selector: {matchLabels: {app: redis}}
  template:
    metadata: {labels: {app: redis, tier: data}}
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          args: ["--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
          ports: [{containerPort: 6379}]
          readinessProbe: {exec: {command: [redis-cli, ping]}, periodSeconds: 5}
---
apiVersion: v1
kind: Service
metadata: {name: redis, namespace: fraud}
spec: {selector: {app: redis}, ports: [{port: 6379}]}
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: kafka, namespace: fraud}
spec:
  serviceName: kafka
  replicas: 1
  selector: {matchLabels: {app: kafka}}
  template:
    metadata: {labels: {app: kafka, tier: data}}
    spec:
      containers:
        - name: kafka
          image: bitnami/kafka:3.7
          env:
            - {name: KAFKA_CFG_NODE_ID, value: "1"}
            - {name: KAFKA_CFG_PROCESS_ROLES, value: "broker,controller"}
            - {name: KAFKA_CFG_CONTROLLER_QUORUM_VOTERS, value: "1@localhost:9093"}
            - {name: KAFKA_CFG_LISTENERS, value: "PLAINTEXT://:9092,CONTROLLER://:9093"}
            - {name: KAFKA_CFG_ADVERTISED_LISTENERS, value: "PLAINTEXT://kafka:9092"}
            - {name: KAFKA_CFG_CONTROLLER_LISTENER_NAMES, value: CONTROLLER}
            - {name: KAFKA_CFG_NUM_PARTITIONS, value: "6"}
          ports: [{containerPort: 9092}]
---
apiVersion: v1
kind: Service
metadata: {name: kafka, namespace: fraud}
spec: {selector: {app: kafka}, ports: [{port: 9092}]}
