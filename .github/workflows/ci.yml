name: CI

on:
  push: {branches: [main]}
  pull_request:

jobs:
  aiml-01-fraud:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: AIML-01}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: pip install --extra-index-url https://download.pytorch.org/whl/cpu -e ".[dev]"
      - run: ruff check src tests
      - run: pytest --cov=fraud --cov-report=term-missing

  aiml-03-recsys:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: AIML-03}}
    env: {TF_USE_LEGACY_KERAS: "1", TF_CPP_MIN_LOG_LEVEL: "2"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - uses: actions/setup-java@v4        # PySpark parity test
        with: {distribution: temurin, java-version: "17"}
      - run: pip install -e ".[dev,spark]"
      - run: ruff check src tests dags ui scripts
      - run: pytest --cov=recsys --cov-report=term-missing
